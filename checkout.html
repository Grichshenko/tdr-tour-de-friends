
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | TDR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

@font-face {
    font-family: 'Morena';
    src: url('fonts/Morena-Light.otf') format('opentype');
    font-weight: 300;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #FAFAFA;
    color: #1A1A1A;
    font-family: 'Montserrat', sans-serif;
}

a {
    text-decoration: none;
}

/* HEADER */

.checkout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 20px;
    background: #32494B;
    color: white;
}

.checkout-back {
    color: white;
    font-size: 25px;
}

.checkout-logo {
    font-family: 'Morena', sans-serif;
    font-size: 24px;
    color: white;
}

/* MAIN */

.checkout-main {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 70px;
}

.checkout-title {
    margin: 0 0 35px;
    font-family: 'Morena', sans-serif;
    font-size: 36px;
    font-weight: 300;
    text-align: center;
}

.checkout-subtitle {
    margin: 30px 0 20px;
    font-size: 18px;
    font-weight: 500;
}

/* ORDER SUMMARY */

.order-summary {
    padding: 20px;
    border-radius: 15px;
    background: #E9F1EC;
}

.order-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #C9DED0;
}

.order-item:last-child {
    border-bottom: none;
}

.order-item img {
    width: 75px;
    height: 65px;
    object-fit: contain;
}

.order-item-info {
    flex: 1;
}

.order-item-info strong {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
}

.order-item-info span {
    font-size: 11px;
    color: #32494B;
}

.empty-cart {
    font-size: 12px;
    line-height: 1.7;
}

/* FORM */

.checkout-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-size: 12px;
    font-weight: 500;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #C9DED0;
    border-radius: 10px;
    outline: none;
    background: white;
    color: #1A1A1A;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #69AD80;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.privacy-group {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 5px;
}

.privacy-group input {
    margin-top: 3px;
    accent-color: #69AD80;
}

.privacy-group label {
    font-size: 11px;
    line-height: 1.7;
}

.submit-order {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    border: none;
    border-radius: 35px;
    background: #69AD80;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    cursor: pointer;
}

.submit-order:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* SUCCESS */

.success-screen {
    display: none;
    padding: 60px 10px;
    text-align: center;
}

.success-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 85px;
    height: 85px;
    margin: 0 auto 25px;
    border-radius: 50%;
    background: #B3D2BE;
    color: #32494B;
    font-size: 40px;
}

.success-screen h2 {
    font-family: 'Morena', sans-serif;
    font-size: 32px;
    font-weight: 300;
}

.success-screen p {
    font-size: 13px;
    line-height: 1.8;
}

.back-home {
    display: block;
    margin-top: 35px;
    padding: 16px;
    border-radius: 35px;
    background: #69AD80;
    color: white;
    font-size: 13px;
}

/* FOOTER */

.checkout-footer {
    padding: 35px 20px;
    background: #32494B;
    color: white;
    text-align: center;
}

.checkout-footer-logo {
    font-family: 'Morena', sans-serif;
    font-size: 28px;
    color: white;
}

.checkout-footer p {
    margin: 20px 0 0;
    font-size: 10px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header class="checkout-header">

    <a href="road-bikes.html"
       class="checkout-back"
       aria-label="Back to road bikes">
        ←
    </a>

    <a href="index.html" class="checkout-logo">
        TDR
    </a>

    <div style="width:25px"></div>

</header>


<!-- MAIN -->

<main class="checkout-main">

    <div id="checkout-content">

        <h1 class="checkout-title">
            Request Order
        </h1>

        <h2 class="checkout-subtitle">
            Your selected equipment
        </h2>

        <div id="order-summary" class="order-summary">
        </div>

        <h2 class="checkout-subtitle">
            Contact information
        </h2>

        <form id="checkout-form" class="checkout-form">

            <div class="form-group">

                <label for="customer-name">
                    Full name *
                </label>

                <input
                    type="text"
                    id="customer-name"
                    name="name"
                    autocomplete="name"
                    placeholder="Your full name"
                    required>

            </div>

            <div class="form-group">

                <label for="customer-email">
                    Email address *
                </label>

                <input
                    type="email"
                    id="customer-email"
                    name="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required>

            </div>

            <div class="form-group">

                <label for="customer-phone">
                    Phone number *
                </label>

                <input
                    type="tel"
                    id="customer-phone"
                    name="phone"
                    autocomplete="tel"
                    placeholder="+47 ..."
                    required>

            </div>

            <div class="form-group">

                <label for="customer-message">
                    Additional information
                </label>

                <textarea
                    id="customer-message"
                    name="message"
                    placeholder="Tell us about your preferences or questions..."></textarea>

            </div>

            <div class="privacy-group">

                <input
                    type="checkbox"
                    id="privacy"
                    required>

                <label for="privacy">
                    I agree to the processing of my personal
                    data for the purpose of this request.
                </label>

            </div>

            <button type="submit"
                    class="submit-order"
                    id="submit-order">
                Submit request
            </button>

        </form>

    </div>


    <!-- SUCCESS SCREEN -->

    <div id="success-screen" class="success-screen">

        <div class="success-icon">
            ✓
        </div>

        <h2>Thank you!</h2>

        <p>
            Your request has been completed
            in this demonstration.
        </p>

        <p>
            This is a prototype, so no actual
            order has been sent.
        </p>

        <a href="index.html" class="back-home">
            Back to Home
        </a>

    </div>

</main>


<!-- FOOTER -->

<footer class="checkout-footer">

    <a href="index.html" class="checkout-footer-logo">
        TDR
    </a>

    <p>
        Tour De Friends — Explore Norway Together
    </p>

</footer>


<!-- JAVASCRIPT -->

<script>

const CART_KEY = 'tdr-cart';

function getCart() {
    try {
        const data = JSON.parse(localStorage.getItem(CART_KEY));
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function renderOrder() {
    const cart = getCart();
    const container = document.getElementById('order-summary');
    const submitButton = document.getElementById('submit-order');

    container.innerHTML = '';

    if (cart.length === 0) {
        const message = document.createElement('p');
        message.className = 'empty-cart';
        message.textContent =
            'Your cart is empty. Please select equipment before requesting an order.';

        container.appendChild(message);
        submitButton.disabled = true;
        return;
    }

    submitButton.disabled = false;

    cart.forEach(item => {
        const row = document.createElement('div');
        row.className = 'order-item';

        const image = document.createElement('img');
        image.src = item.image;
        image.alt = item.name;

        const info = document.createElement('div');
        info.className = 'order-item-info';

        const name = document.createElement('strong');
        name.textContent = item.name;

        const quantity = document.createElement('span');
        quantity.textContent = 'Quantity: ' + item.quantity;

        info.append(name, quantity);
        row.append(image, info);
        container.appendChild(row);
    });
}

document.getElementById('checkout-form')
    .addEventListener('submit', function(event) {

        event.preventDefault();

        const cart = getCart();

        if (cart.length === 0) {
            renderOrder();
            return;
        }

        // Demonstration only:
        // No data is transmitted to a server.

        localStorage.removeItem(CART_KEY);

        document.getElementById('checkout-content').style.display = 'none';

        document.getElementById('success-screen').style.display = 'block';

        window.scrollTo(0, 0);
    });

renderOrder();

</script>

</body>
</html>
